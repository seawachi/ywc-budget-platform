  <text x="280" y="352" font-family="monospace" font-size="13" fill="#DC2626" text-anchor="middle">1</text>
  <text x="395" y="352" font-family="monospace" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="end">189.00</text>

  <!-- Item 4 (ของส่วนตัว ขนม) -->
  <rect x="45" y="400" width="360" height="50" fill="#FEF2F2" rx="4" stroke="#FECACA" />
  <text x="52" y="422" font-family="monospace" font-size="13" font-weight="bold" fill="#DC2626">4. ชานมเย็นกระป๋อง [ส่วนตัว]</text>
  <text x="52" y="438" font-family="monospace" font-size="11" fill="#DC2626">   2 กระป๋อง @ 30.50 บาท</text>
  <text x="280" y="422" font-family="monospace" font-size="13" fill="#DC2626" text-anchor="middle">2</text>
  <text x="395" y="422" font-family="monospace" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="end">61.00</text>

  <!-- Divider -->
  <line x1="45" y1="475" x2="405" y2="475" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Totals Section -->
  <text x="50" y="495" font-family="sans-serif" font-size="12" fill="#64748B">มูลค่าสินค้าก่อนภาษี (Subtotal):</text>
  <text x="395" y="495" font-family="monospace" font-size="12" fill="#64748B" text-anchor="end">1,450.00 THB</text>

  <text x="50" y="515" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4F46E5">ภาษีมูลค่าเพิ่ม 7% (VAT 7%):</text>
  <text x="395" y="515" font-family="monospace" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="end">101.50 THB</text>

  <text x="50" y="535" font-family="sans-serif" font-size="12" fill="#16A34A">รวมสินค้าค่ายที่ควรเบิก (+VAT):</text>
  <text x="395" y="535" font-family="monospace" font-size="12" font-weight="bold" fill="#16A34A" text-anchor="end">1,284.00 THB</text>

  <text x="50" y="555" font-family="sans-serif" font-size="12" fill="#EF4444">รวมของส่วนตัว (ต้องติ๊กออก):</text>
  <text x="395" y="555" font-family="monospace" font-size="12" font-weight="bold" fill="#EF4444" text-anchor="end">267.50 THB</text>

  <line x1="45" y1="565" x2="405" y2="565" stroke="#0F172A" stroke-width="2" />

  <text x="50" y="585" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0F172A">ยอดรวมทั้งสิ้น (TOTAL):</text>
  <text x="395" y="585" font-family="monospace" font-size="16" font-weight="900" fill="#0F172A" text-anchor="end">1,551.50 THB</text>

