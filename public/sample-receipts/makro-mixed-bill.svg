  <text x="50" y="308" font-family="monospace" font-size="11" fill="#64748B">   5 กระสอบ @ 40.00 บาท</text>
  <text x="280" y="290" font-family="monospace" font-size="13" fill="#0F172A" text-anchor="middle">5</text>
  <text x="395" y="290" font-family="monospace" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="end">200.00</text>

  <!-- Item 3 (ของใช้ส่วนตัว - แมว/ขนม) -->
