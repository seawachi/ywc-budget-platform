<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 720" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#F1F5F9"/>
  
  <!-- Receipt Paper -->
  <g filter="url(#paper-shadow)">
    <rect x="25" y="20" width="400" height="680" rx="4" fill="#FFFFFF" />
  </g>

  <!-- Makro Header -->
  <rect x="25" y="20" width="400" height="8" fill="#DC2626" />
  <text x="225" y="60" font-family="sans-serif" font-weight="900" font-size="28" fill="#DC2626" text-anchor="middle">makro</text>
  <text x="225" y="80" font-family="sans-serif" font-weight="bold" font-size="12" fill="#334155" text-anchor="middle">SIAM MAKRO PUBLIC COMPANY LIMITED</text>
  <text x="225" y="98" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">สาขา 00124 สามย่านมิตรทาวน์ TAX ID: 0107531000191</text>
  <text x="225" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">ใบกำกับภาษีอย่างย่อ / ใบเสร็จรับเงิน (ABB TAX INVOICE)</text>

  <!-- Divider Dash -->
  <line x1="45" y1="130" x2="405" y2="130" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Info -->
  <text x="50" y="152" font-family="monospace" font-size="12" fill="#334155">POS: 04   CASHIER: 1042</text>
  <text x="395" y="152" font-family="monospace" font-size="12" fill="#334155" text-anchor="end">28/10/2026 14:22</text>
  <text x="50" y="172" font-family="monospace" font-size="12" fill="#334155">RECEIPT NO: MK-20261028-9841</text>

  <line x1="45" y1="185" x2="405" y2="185" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Column Headers -->
  <text x="50" y="205" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">รายการสินค้า (Description)</text>
  <text x="280" y="205" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">จำนวน</text>
  <text x="395" y="205" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="end">จำนวนเงิน</text>
  
  <line x1="45" y1="215" x2="405" y2="215" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Item 1 (ค่าย) -->
  <text x="50" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0F172A">1. น้ำดื่มสิงห์ 600ml x 12</text>
  <text x="50" y="258" font-family="monospace" font-size="11" fill="#64748B">   20 แพ็ค @ 50.00 บาท</text>
  <text x="280" y="240" font-family="monospace" font-size="13" fill="#0F172A" text-anchor="middle">20</text>
  <text x="395" y="240" font-family="monospace" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="end">1,000.00</text>

  <!-- Item 2 (ค่าย) -->
