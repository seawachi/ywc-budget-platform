<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <filter id="bill-shadow">
      <feDropShadow dx="2" dy="8" stdDeviation="7" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#E2E8F0" />

  <!-- Bill Sheet -->
  <g filter="url(#bill-shadow)">
    <!-- Slightly off-white yellowish bill paper -->
    <rect x="25" y="25" width="450" height="650" rx="3" fill="#FFFDF8" stroke="#E2D9C8" stroke-width="1.5" />
  </g>

  <!-- Pre-printed Border -->
  <rect x="40" y="40" width="420" height="620" fill="none" stroke="#93C5FD" stroke-width="2" />

  <!-- Pre-printed Title in Thai Red/Blue ink -->
  <text x="250" y="80" font-family="'Sarabun', sans-serif" font-weight="900" font-size="24" fill="#1E3A8A" text-anchor="middle">บิลเงินสด / CASH RECEIPT</text>
  <text x="250" y="105" font-family="sans-serif" font-weight="bold" font-size="14" fill="#B91C1C" text-anchor="middle">ร้านป้าสมใจ อาหารตามสั่ง (สาขาสามย่าน)</text>
  <text x="250" y="125" font-family="sans-serif" font-size="11" fill="#4B5563" text-anchor="middle">123/4 ถ.พญาไท แขวงวังใหม่ เขตปทุมวัน กทม. โทร 089-999-1234</text>

  <!-- Bill info fields -->
  <text x="55" y="160" font-family="sans-serif" font-size="12" fill="#1E293B">นามผู้ซื้อ / Name:</text>
  <text x="160" y="160" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#1E40AF" font-weight="bold">ค่ายวิศวะพัฒนาน้อง (จุฬาฯ)</text>
  <line x1="155" y1="165" x2="440" y2="165" stroke="#93C5FD" stroke-dasharray="2 2"/>

  <text x="55" y="190" font-family="sans-serif" font-size="12" fill="#1E293B">วันที่ / Date:</text>
  <text x="130" y="190" font-family="'Caveat', cursive, sans-serif" font-size="17" fill="#1E40AF" font-weight="bold">27 ต.ค. 2569</text>
  <line x1="125" y1="195" x2="260" y2="195" stroke="#93C5FD" stroke-dasharray="2 2"/>

  <text x="280" y="190" font-family="sans-serif" font-size="12" fill="#1E293B">เลขที่ / No:</text>
  <text x="350" y="190" font-family="monospace" font-size="15" fill="#B91C1C" font-weight="bold">0489</text>

  <!-- Table Header -->
  <rect x="40" y="210" width="420" height="35" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />
  <text x="80" y="233" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1E3A8A">จำนวน (Qty)</text>
  <text x="230" y="233" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1E3A8A" text-anchor="middle">รายการ (Description)</text>
  <text x="360" y="233" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1E3A8A" text-anchor="middle">หน่วยละ</text>
  <text x="430" y="233" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1E3A8A" text-anchor="end">จำนวนเงิน</text>

  <!-- Table Grid Lines -->
  <line x1="120" y1="210" x2="120" y2="530" stroke="#93C5FD" stroke-width="1.5" />
  <line x1="330" y1="210" x2="330" y2="530" stroke="#93C5FD" stroke-width="1.5" />
  <line x1="390" y1="210" x2="390" y2="530" stroke="#93C5FD" stroke-width="1.5" />

  <!-- Handwritten Row 1 -->
  <text x="80" y="275" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#1E40AF" font-weight="bold">100 กล่อง</text>
  <text x="130" y="275" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#1E40AF" font-weight="bold">ข้าวหมูกรอบ + ไข่ดาว</text>
  <text x="360" y="275" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#1E40AF" font-weight="bold" text-anchor="middle">60.-</text>
  <text x="445" y="275" font-family="'Caveat', cursive, sans-serif" font-size="20" fill="#1E40AF" font-weight="bold" text-anchor="end">6,000.-</text>
  <line x1="40" y1="295" x2="460" y2="295" stroke="#DBEAFE" />

  <!-- Handwritten Row 2 -->
  <text x="80" y="335" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#1E40AF" font-weight="bold">1 หม้อ</text>
  <text x="130" y="335" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#1E40AF" font-weight="bold">น้ำซุปกระดูกหมู (หม้อใหญ่)</text>
  <text x="360" y="335" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#1E40AF" font-weight="bold" text-anchor="middle">500.-</text>
  <text x="445" y="335" font-family="'Caveat', cursive, sans-serif" font-size="20" fill="#1E40AF" font-weight="bold" text-anchor="end">500.-</text>
  <line x1="40" y1="355" x2="460" y2="355" stroke="#DBEAFE" />

  <line x1="40" y1="415" x2="460" y2="415" stroke="#DBEAFE" />
  <line x1="40" y1="475" x2="460" y2="475" stroke="#DBEAFE" />
  <line x1="40" y1="530" x2="460" y2="530" stroke="#93C5FD" stroke-width="1.5" />

  <!-- Total Section -->
  <rect x="40" y="530" width="290" height="45" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.5" />
  <text x="50" y="558" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A">จำนวนเงินตัวอักษร: (หกพันห้าร้อยบาทถ้วน)</text>

  <rect x="330" y="530" width="130" height="45" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />
  <text x="445" y="562" font-family="'Caveat', cursive, sans-serif" font-size="24" fill="#B91C1C" font-weight="900" text-anchor="end">6,500.-</text>

  <!-- Signatures -->
  <text x="110" y="620" font-family="sans-serif" font-size="12" fill="#4B5563">ผู้รับเงิน / Collector</text>
  <text x="100" y="605" font-family="'Caveat', cursive, sans-serif" font-size="20" fill="#1E40AF" font-weight="bold">สมใจ นวลศรี</text>

  <!-- Paid Stamp -->
  <g transform="translate(320, 580) rotate(-12)">
    <rect x="0" y="0" width="105" height="38" rx="6" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 4"/>
    <text x="52" y="26" font-family="sans-serif" font-weight="900" font-size="18" fill="#DC2626" text-anchor="middle">PAID จ่ายแล้ว</text>
  </g>
</svg>
